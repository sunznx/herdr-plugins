id = "sunznx.herdr-rename"
name = "Herdr Rename"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Rename the triggering pane and its detected agent together."
platforms = ["macos"]

[[actions]]
id = "open"
title = "Rename pane and agent…"
description = "Rename the current pane and its detected agent"
contexts = ["pane"]
command = ["bash", "open.sh"]

[[panes]]
id = "picker"
title = "Rename pane and agent"
placement = "popup"
width = 64
height = 8
command = ["bash", "rename.sh"]
