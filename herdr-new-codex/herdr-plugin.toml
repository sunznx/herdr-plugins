id = "sunznx.herdr-new-codex"
name = "Herdr New Codex"
version = "0.1.8"
min_herdr_version = "0.8.0"
description = "Choose a workspace and open a new Codex tab."
platforms = ["macos"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "herdr-plugin", "../cmd/herdr-plugin"]

[[actions]]
id = "codex"
title = "New Codex tab in workspace"
contexts = ["workspace"]
command = ["./herdr-plugin", "new-codex", "open"]

[[actions]]
id = "tab"
title = "New tab in workspace"
contexts = ["workspace"]
command = ["./herdr-plugin", "new-codex", "open-tab"]

[[actions]]
id = "claude"
title = "New Claude tab in workspace"
description = "Choose a workspace and open a new Claude tab."
contexts = ["workspace"]
command = ["./herdr-plugin", "new-codex", "claude"]

[[actions]]
id = "herdr-close-codex"
title = "Archive and close Codex pane"
contexts = ["pane"]
command = ["./herdr-plugin", "new-codex", "close"]

[[panes]]
id = "picker"
title = "New Codex tab in workspace"
placement = "popup"
width = 64
height = 20
command = ["./herdr-plugin", "new-codex", "picker"]

[[panes]]
id = "tab-picker"
title = "New tab in workspace"
placement = "popup"
width = 64
height = 20
command = ["./herdr-plugin", "new-codex", "tab-picker"]

[[panes]]
id = "claude-picker"
title = "New Claude tab in workspace"
placement = "popup"
width = 64
height = 20
command = ["./herdr-plugin", "new-codex", "claude-picker"]
