id = "sunznx.open-in"
name = "Open In"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Open the triggering pane's current directory in Emacs, IntelliJ IDEA, or Fork."
platforms = ["macos"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "herdr-plugin", "../cmd/herdr-plugin"]

[[actions]]
id = "open-in-emacs"
title = "Open current directory in Emacs"
contexts = ["workspace"]
command = ["./herdr-plugin", "open-in", "open", "Emacs"]

[[actions]]
id = "open-in-idea"
title = "Open current directory in IntelliJ IDEA"
contexts = ["workspace"]
command = ["./herdr-plugin", "open-in", "open", "IntelliJ IDEA"]

[[actions]]
id = "open-in-fork"
title = "Open current directory in Fork"
contexts = ["workspace"]
command = ["./herdr-plugin", "open-in", "open", "Fork"]
