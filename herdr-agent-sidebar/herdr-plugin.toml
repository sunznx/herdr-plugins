id = "sunznx.herdr-agent-sidebar"
name = "Herdr Agent Sidebar"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Use a compact, task-first layout for Herdr's Agent sidebar."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "configure"
title = "Configure Agent sidebar"
description = "Install the managed Agent sidebar layout and reload Herdr."
command = ["go", "run", "../cmd/herdr-plugin", "agent-sidebar", "configure"]

[[actions]]
id = "unconfigure"
title = "Restore Agent sidebar"
description = "Remove this plugin's managed Agent sidebar layout and reload Herdr."
command = ["go", "run", "../cmd/herdr-plugin", "agent-sidebar", "unconfigure"]

[[actions]]
id = "restart"
title = "Restart Agent sidebar"
description = "Replace the running Agent sidebar daemon after an update."
contexts = ["global"]
command = ["go", "run", "../cmd/herdr-plugin", "agent-sidebar", "restart"]

[[actions]]
id = "hide-machine-name"
title = "Hide this machine name in Agent sidebar"
description = "Show only workspace labels on this server; other servers keep their machine suffix."
contexts = ["global"]
command = ["go", "run", "../cmd/herdr-plugin", "agent-sidebar", "hide-machine-name"]

[[startup]]
command = ["go", "run", "../cmd/herdr-plugin", "agent-sidebar", "daemon"]
