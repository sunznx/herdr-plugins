id = "sunznx.yazi-popup"
name = "Yazi Popup"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Open Yazi popups for file picking, fzf navigation, rg content search, and .trellis browsing."
platforms = ["macos"]

[[panes]]
id = "picker"
title = "Yazi Picker"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "bin/picker.sh"]

[[panes]]
id = "fzf"
title = "Yazi fzf"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "bin/browser.sh", "fzf"]

[[panes]]
id = "rg"
title = "Yazi rg"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "bin/browser.sh", "rg"]

[[panes]]
id = "trellis"
title = "Trellis"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "bin/browser.sh", "trellis"]

[[actions]]
id = "pick"
title = "Pick file with Yazi"
description = "Open a Yazi popup and insert the picked path(s) as @path into the pane that triggered it"
contexts = ["workspace"]
command = ["bash", "bin/open.sh", "pick"]

[[actions]]
id = "fzf"
title = "Open Yazi fzf"
description = "Open Yazi and immediately enter its built-in fzf file navigator"
contexts = ["workspace"]
command = ["bash", "bin/open.sh", "fzf"]

[[actions]]
id = "rg"
title = "Search contents with rg in Yazi"
description = "Open Yazi and immediately prompt for a ripgrep content search"
contexts = ["workspace"]
command = ["bash", "bin/open.sh", "rg"]

[[actions]]
id = "trellis"
title = "Open .trellis in Yazi"
description = "Browse the current directory's .trellis folder in reverse filename order"
contexts = ["workspace"]
command = ["bash", "bin/open.sh", "trellis"]
