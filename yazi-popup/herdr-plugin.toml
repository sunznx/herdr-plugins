id = "sunznx.yazi-popup"
name = "Yazi Popup"
version = "0.3.4"
min_herdr_version = "0.8.0"
description = "Open Yazi popups for file picking, fzf navigation, and real-time rg content search."
platforms = ["macos"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "herdr-plugin", "../cmd/herdr-plugin"]

[[panes]]
id = "picker"
title = "Yazi Picker"
placement = "popup"
width = "80%"
height = "80%"
command = ["./herdr-plugin", "yazi", "picker"]

[[panes]]
id = "fzf"
title = "Yazi fzf"
placement = "popup"
width = "80%"
height = "80%"
command = ["./herdr-plugin", "yazi", "browser", "fzf"]

[[panes]]
id = "rg"
title = "Yazi fr"
placement = "popup"
width = "80%"
height = "80%"
command = ["./herdr-plugin", "yazi", "browser", "rg"]

[[actions]]
id = "pick"
title = "Pick file with Yazi"
description = "Open a Yazi popup and insert the picked path(s) as @path into the pane that triggered it"
contexts = ["workspace"]
command = ["./herdr-plugin", "yazi", "open", "pick"]

[[actions]]
id = "fzf"
title = "Open Yazi fzf"
description = "Open Yazi and immediately enter its built-in fzf file navigator"
contexts = ["workspace"]
command = ["./herdr-plugin", "yazi", "open", "fzf"]

[[actions]]
id = "rg"
title = "Search contents with fr.yazi"
description = "Open Yazi and immediately enter fr.yazi's real-time rg content search"
contexts = ["workspace"]
command = ["./herdr-plugin", "yazi", "open", "rg"]
