id = "sunznx.trellis-popup"
name = "Trellis Popup"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Browse the current pane's .trellis directory in a Yazi popup sorted by name in reverse order."
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open .trellis in Yazi"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[panes]]
id = "browser"
title = "Trellis"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "-c", "exec \"${SHELL:-/bin/zsh}\" -ic 'exec \"$HERDR_PLUGIN_ROOT/launch.sh\"'"]
